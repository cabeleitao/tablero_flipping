<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar gasto — Flipping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <a class="back" href="index.html">← Panel</a>
    <h1 style="margin-top:8px">Cargar gasto</h1>
    <p class="sub" style="color:rgba(255,255,255,0.65)">Ejecución de obra</p>
  </div>
</div>

<div class="wrap">
<div class="card">
<form id="f">
  <label for="proyecto">Proyecto</label>
  <select id="proyecto" required>
    <option value="">Cargando proyectos…</option>
  </select>

  <label for="fecha">Fecha</label>
  <input type="date" id="fecha" required>

  <label for="rubro">Rubro</label>
  <select id="rubro" required>
    <option value="compra">Compra</option>
    <option value="remodelacion" selected>Remodelación</option>
    <option value="cierre_venta">Cierre / venta</option>
  </select>

  <label for="sub_rubro">Sub-rubro (opcional)</label>
  <input type="text" id="sub_rubro" placeholder="ej: cocina, baños, techo">

  <label for="monto">Monto</label>
  <input type="number" id="monto" step="0.01" min="0" required>

  <label for="proveedor_gc">Proveedor / GC</label>
  <input type="text" id="proveedor_gc">

  <label for="comprobante_nota">Comprobante o nota</label>
  <textarea id="comprobante_nota"></textarea>

  <button type="submit" id="btn">Guardar gasto</button>
  <div id="msg"></div>
</form>
</div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtByIeeZt4ohelM1HOtzqVGj4dal4sgVri4-2vVRS3F1yWiEX81wh8y8cBrNBirc8x/exec';
  const idPreseleccionado = new URLSearchParams(window.location.search).get('id');

  document.getElementById('fecha').valueAsDate = new Date();

  fetch(APPS_SCRIPT_URL + '?accion=proyectos')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const sel = document.getElementById('proyecto');
      sel.innerHTML = '';
      if (!data.ok || !data.proyectos.length) {
        sel.innerHTML = '<option value="">No hay proyectos cargados</option>';
        return;
      }
      data.proyectos.forEach(function(p) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.nombre + ' (' + p.estado + ')';
        if (idPreseleccionado && p.id === idPreseleccionado) opt.selected = true;
        sel.appendChild(opt);
      });
    })
    .catch(function() {
      document.getElementById('proyecto').innerHTML = '<option value="">Error al cargar proyectos</option>';
    });

  document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = '';

    const fields = {
      gasto_id: 'g-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      id_proyecto: document.getElementById('proyecto').value,
      fecha: document.getElementById('fecha').value,
      rubro: document.getElementById('rubro').value,
      sub_rubro: document.getElementById('sub_rubro').value,
      monto: document.getElementById('monto').value,
      proveedor_gc: document.getElementById('proveedor_gc').value,
      comprobante_nota: document.getElementById('comprobante_nota').value
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sheet: 'Ejecucion', fields: fields })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        btn.disabled = false;
        if (data.ok) {
          msg.textContent = 'Gasto guardado. Volviendo…';
          msg.className = 'ok';
          const destino = idPreseleccionado ? ('proyecto-editar.html?id=' + encodeURIComponent(idPreseleccionado)) : 'index.html';
          setTimeout(function() { window.location.href = destino; }, 700);
        } else {
          msg.textContent = 'Error: ' + data.error;
          msg.className = 'err';
        }
      })
      .catch(function() {
        btn.disabled = false;
        msg.textContent = 'No se pudo conectar. Reintentá.';
        msg.className = 'err';
      });
  });
</script>
</body>
</html>
