<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar gasto — Flipping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <a class="back" href="index.html">← Panel</a>
    <h1 style="margin-top:8px">Cargar gasto</h1>
    <p class="sub" style="color:rgba(255,255,255,0.65)">Ejecución de obra</p>
  </div>
</div>

<div class="wrap">
<div class="card">
<form id="f">
  <label for="proyecto">Proyecto</label>
  <select id="proyecto" required>
    <option value="">Cargando proyectos…</option>
  </select>

  <label for="fecha">Fecha</label>
  <input type="date" id="fecha" required>

  <label for="rubro">Rubro</label>
  <select id="rubro" required>
    <option value="compra">Compra</option>
    <option value="remodelacion" selected>Remodelación</option>
    <option value="cierre_venta">Cierre / venta</option>
  </select>

  <label for="sub_rubro">Sub-rubro (opcional)</label>
  <input type="text" id="sub_rubro" placeholder="ej: cocina, baños, techo">

  <label for="monto">Monto</label>
  <input type="number" id="monto" step="0.01" min="0" required>

  <label for="proveedor_gc">Proveedor / GC</label>
  <input type="text" id="proveedor_gc">

  <label for="comprobante_nota" style="display:flex;align-items:center;justify-content:space-between">
    <span>Comprobante o nota</span>
    <button type="button" id="btn-adjuntar" style="background:none;border:none;cursor:pointer;font-size:20px;padding:0 4px" title="Adjuntar foto">📎</button>
  </label>
  <input type="file" id="input-archivo" accept="image/*,.pdf" style="display:none">
  <div id="adjunto-preview" style="display:none;margin-bottom:10px;font-size:13px"></div>
  <textarea id="comprobante_nota"></textarea>

  <button type="submit" id="btn">Guardar gasto</button>
  <div id="msg"></div>
</form>
</div>
</div>

<script>
  // --- Conexión a Supabase (reemplaza Apps Script) ---
  const SUPABASE_URL = 'https://gdmgwbutazkrmzecncar.supabase.co/rest/v1';
  const SUPABASE_KEY = 'sb_publishable_F9Om9ujffEDhsnfs7LmPWg_O1OticCa';

  function sbHeaders(extra) {
    return Object.assign({
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, extra || {});
  }
  function orNull(v) { return (v === '' || v === undefined) ? null : v; }

  const STORAGE_URL = 'https://gdmgwbutazkrmzecncar.supabase.co/storage/v1';
  let comprobanteUrl = '';

  document.getElementById('btn-adjuntar').addEventListener('click', function() {
    document.getElementById('input-archivo').click();
  });

  document.getElementById('input-archivo').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const preview = document.getElementById('adjunto-preview');
    preview.style.display = 'block';
    preview.textContent = 'Subiendo ' + file.name + '…';
    document.getElementById('btn-adjuntar').disabled = true;

    const nombreArchivo = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    fetch(STORAGE_URL + '/object/comprobantes/' + nombreArchivo, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    }).then(function(r) {
      document.getElementById('btn-adjuntar').disabled = false;
      if (!r.ok) {
        preview.textContent = 'Error al subir el archivo.';
        return;
      }
      comprobanteUrl = STORAGE_URL + '/object/public/comprobantes/' + nombreArchivo;
      preview.innerHTML = '✅ Adjuntado: ' + file.name + ' <a href="#" id="btn-quitar-adjunto" style="color:var(--danger);margin-left:8px">quitar</a>';
      document.getElementById('btn-quitar-adjunto').addEventListener('click', function(e) {
        e.preventDefault();
        comprobanteUrl = '';
        preview.style.display = 'none';
        document.getElementById('input-archivo').value = '';
      });
    }).catch(function() {
      document.getElementById('btn-adjuntar').disabled = false;
      preview.textContent = 'No se pudo conectar para subir el archivo.';
    });
  });

  const idPreseleccionado = new URLSearchParams(window.location.search).get('id');

  document.getElementById('fecha').valueAsDate = new Date();

  fetch(SUPABASE_URL + '/proyectos?select=id_proyecto,nombre_direccion,estado&order=nombre_direccion.asc', { headers: sbHeaders() })
    .then(function(r) { return r.json(); })
    .then(function(proyectos) {
      const sel = document.getElementById('proyecto');
      sel.innerHTML = '';
      if (!proyectos || !proyectos.length) {
        sel.innerHTML = '<option value="">No hay proyectos cargados</option>';
        return;
      }
      proyectos.forEach(function(p) {
        const opt = document.createElement('option');
        opt.value = p.id_proyecto;
        opt.textContent = p.nombre_direccion + ' (' + p.estado + ')';
        if (idPreseleccionado && p.id_proyecto === idPreseleccionado) opt.selected = true;
        sel.appendChild(opt);
      });
    })
    .catch(function() {
      document.getElementById('proyecto').innerHTML = '<option value="">Error al cargar proyectos</option>';
    });

  document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = '';

    const notaTexto = document.getElementById('comprobante_nota').value;
    const notaFinal = comprobanteUrl
      ? (notaTexto ? notaTexto + ' — Comprobante: ' + comprobanteUrl : 'Comprobante: ' + comprobanteUrl)
      : notaTexto;

    const fields = {
      gasto_id: 'g-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      id_proyecto: document.getElementById('proyecto').value,
      fecha: orNull(document.getElementById('fecha').value),
      rubro: document.getElementById('rubro').value,
      sub_rubro: orNull(document.getElementById('sub_rubro').value),
      monto: document.getElementById('monto').value,
      proveedor_gc: orNull(document.getElementById('proveedor_gc').value),
      comprobante_nota: orNull(notaFinal)
    };

    fetch(SUPABASE_URL + '/ejecucion', {
      method: 'POST',
      headers: sbHeaders({ Prefer: 'return=minimal' }),
      body: JSON.stringify(fields)
    })
      .then(function(r) {
        btn.disabled = false;
        if (r.ok) {
          msg.textContent = 'Gasto guardado. Volviendo…';
          msg.className = 'ok';
          const destino = idPreseleccionado ? ('proyecto-editar.html?id=' + encodeURIComponent(idPreseleccionado)) : 'index.html';
          setTimeout(function() { window.location.href = destino; }, 700);
        } else {
          msg.textContent = 'Error al guardar.';
          msg.className = 'err';
        }
      })
      .catch(function() {
        btn.disabled = false;
        msg.textContent = 'No se pudo conectar. Reintentá.';
        msg.className = 'err';
      });
  });
</script>
<p style="text-align:center;color:var(--text-muted, #9aa4b2);font-size:11px;padding:20px 0 30px">ejecucion.html · última actualización en GitHub: <span id="fecha-archivo"></span></p>
<script>document.getElementById('fecha-archivo').textContent = document.lastModified;</script>
</body>
</html>
