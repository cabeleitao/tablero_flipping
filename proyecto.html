<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar proyecto — Flipping</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <a class="back" href="index.html">← Panel</a>
    <h1 style="margin-top:8px">Cargar proyecto</h1>
    <p class="sub" style="color:rgba(255,255,255,0.65)">Alta, financiamiento y cierre</p>
  </div>
</div>

<div class="wrap">
<div class="card">
<div class="tabs">
  <div class="tab active" data-target="nuevo">Nuevo proyecto</div>
  <div class="tab" data-target="financiamiento">Financiamiento</div>
  <div class="tab" data-target="cierre">Cierre y venta</div>
</div>

<form id="f">

  <div class="section active" id="sec-nuevo">
    <label for="nombre_direccion">Nombre / dirección</label>
    <input type="text" id="nombre_direccion">

    <label for="pais">País</label>
    <select id="pais">
      <option value="ARG">Argentina</option>
      <option value="USA">USA</option>
    </select>

    <label for="fecha_compra">Fecha de compra</label>
    <input type="date" id="fecha_compra">

    <label for="estado">Estado</label>
    <select id="estado">
      <option value="analisis">Análisis</option>
      <option value="en_curso" selected>En curso</option>
      <option value="vendido">Vendido</option>
    </select>

    <label for="fecha_venta_estimada">Fecha de venta estimada</label>
    <input type="date" id="fecha_venta_estimada">

    <label for="precio_venta_estimado">Precio de venta estimado</label>
    <input type="number" id="precio_venta_estimado" step="0.01" min="0">

    <label style="margin-top:22px">Presupuesto inicial</label>
    <label for="presupuesto_compra" style="margin-top:8px">Compra estimada</label>
    <input type="number" id="presupuesto_compra" step="0.01" min="0">
    <label for="presupuesto_remodelacion">Remodelación estimada</label>
    <input type="number" id="presupuesto_remodelacion" step="0.01" min="0">
    <label for="presupuesto_cierre">Cierre estimado</label>
    <input type="number" id="presupuesto_cierre" step="0.01" min="0">
  </div>

  <div class="section" id="sec-financiamiento">
    <label for="proyecto_fin">Proyecto</label>
    <select id="proyecto_fin"><option value="">Cargando proyectos…</option></select>

    <label for="tipo_fuente">Tipo de fuente</label>
    <select id="tipo_fuente">
      <option value="propio">Capital propio</option>
      <option value="prestamo">Préstamo de terceros</option>
      <option value="inversor">Inversor</option>
    </select>

    <label for="destino">Destino</label>
    <select id="destino">
      <option value="compra">Compra</option>
      <option value="remodelacion">Remodelación</option>
    </select>

    <div id="fecha-monto-propio">
      <label for="monto_propio_total">Monto total aportado</label>
      <input type="number" id="monto_propio_total" step="0.01" min="0">

      <label for="fecha_desembolso_propio">Fecha</label>
      <input type="date" id="fecha_desembolso_propio">

      <label style="margin-top:22px">Reparto entre socios</label>
      <div id="socios-lista"></div>
      <button type="button" class="add-socio" id="btn-add-socio">+ Agregar socio</button>
      <p class="pct-total" id="pct-total">Total: 100%</p>
    </div>

    <div id="campos-terceros" style="display:none">
      <label for="nombre_prestamista_inversor">Nombre del prestamista o inversor</label>
      <input type="text" id="nombre_prestamista_inversor">

      <label for="monto_fin">Monto</label>
      <input type="number" id="monto_fin" step="0.01" min="0">

      <label for="tasa_anual">Tasa anual (%)</label>
      <input type="number" id="tasa_anual" step="0.01" min="0">

      <label for="fecha_desembolso">Fecha de desembolso</label>
      <input type="date" id="fecha_desembolso">

      <label for="penalidad_prepago">Penalidad por cancelación anticipada</label>
      <input type="text" id="penalidad_prepago" placeholder="ej: 1 año, 2% del saldo">

      <label for="retorno_pactado">Retorno pactado (solo inversores)</label>
      <input type="text" id="retorno_pactado" placeholder="ej: 14% anual">
    </div>
  </div>

  <div class="section" id="sec-cierre">
    <label for="proyecto_cierre">Proyecto</label>
    <select id="proyecto_cierre"><option value="">Cargando proyectos…</option></select>

    <label for="fecha_venta">Fecha de venta</label>
    <input type="date" id="fecha_venta">

    <label for="precio_venta">Precio de venta</label>
    <input type="number" id="precio_venta" step="0.01" min="0">

    <label for="gastos_cierre_venta">Gastos de cierre de venta</label>
    <input type="number" id="gastos_cierre_venta" step="0.01" min="0">

    <label for="fecha_cancelacion_prestamo">Fecha de cancelación del préstamo</label>
    <input type="date" id="fecha_cancelacion_prestamo">
  </div>

  <button type="submit" id="btn">Guardar</button>
  <div id="msg"></div>
</form>
</div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtByIeeZt4ohelM1HOtzqVGj4dal4sgVri4-2vVRS3F1yWiEX81wh8y8cBrNBirc8x/exec';
  let activeTab = 'nuevo';
  let socios = [
    { nombre: 'Fede', pct: 50 },
    { nombre: 'Cabe', pct: 50 }
  ];

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
      tab.classList.add('active');
      activeTab = tab.dataset.target;
      document.getElementById('sec-' + activeTab).classList.add('active');
      document.getElementById('msg').textContent = '';
    });
  });

  function renderSocios() {
    const cont = document.getElementById('socios-lista');
    cont.innerHTML = '';
    socios.forEach(function(s, i) {
      const row = document.createElement('div');
      row.className = 'socio-row';
      row.innerHTML =
        '<input type="text" value="' + s.nombre + '" data-i="' + i + '" data-f="nombre" placeholder="Nombre">' +
        '<input type="number" value="' + s.pct + '" data-i="' + i + '" data-f="pct" min="0" max="100" step="0.1">' +
        '<span style="font-size:13px;color:var(--text-secondary)">%</span>' +
        (socios.length > 1 ? '<button type="button" class="rm" data-i="' + i + '">×</button>' : '');
      cont.appendChild(row);
    });
    cont.querySelectorAll('input').forEach(function(inp) {
      inp.addEventListener('input', function() {
        const i = parseInt(inp.dataset.i);
        const f = inp.dataset.f;
        socios[i][f] = f === 'pct' ? parseFloat(inp.value) || 0 : inp.value;
        updatePctTotal();
      });
    });
    cont.querySelectorAll('.rm').forEach(function(btn) {
      btn.addEventListener('click', function() {
        socios.splice(parseInt(btn.dataset.i), 1);
        renderSocios();
        updatePctTotal();
      });
    });
    updatePctTotal();
  }

  function updatePctTotal() {
    const total = socios.reduce(function(acc, s) { return acc + (parseFloat(s.pct) || 0); }, 0);
    const el = document.getElementById('pct-total');
    el.textContent = 'Total: ' + total.toFixed(1) + '%';
    el.className = 'pct-total' + (Math.abs(total - 100) > 0.5 ? ' err' : '');
  }

  document.getElementById('btn-add-socio').addEventListener('click', function() {
    socios.push({ nombre: '', pct: 0 });
    renderSocios();
  });
  renderSocios();

  document.getElementById('tipo_fuente').addEventListener('change', function() {
    const esPropio = this.value === 'propio';
    document.getElementById('fecha-monto-propio').style.display = esPropio ? 'block' : 'none';
    document.getElementById('campos-terceros').style.display = esPropio ? 'none' : 'block';
  });
  document.getElementById('fecha-monto-propio').style.display = 'block';
  document.getElementById('campos-terceros').style.display = 'none';

  function cargarProyectos(selectId) {
    fetch(APPS_SCRIPT_URL + '?accion=proyectos')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        const sel = document.getElementById(selectId);
        sel.innerHTML = '';
        if (!data.ok || !data.proyectos.length) {
          sel.innerHTML = '<option value="">No hay proyectos cargados</option>';
          return;
        }
        data.proyectos.forEach(function(p) {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.nombre + ' (' + p.estado + ')';
          sel.appendChild(opt);
        });
      })
      .catch(function() {
        document.getElementById(selectId).innerHTML = '<option value="">Error al cargar proyectos</option>';
      });
  }
  cargarProyectos('proyecto_fin');
  cargarProyectos('proyecto_cierre');

  function generarIdProyecto(nombre) {
    const slug = (nombre || 'proyecto')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '')
      .slice(0, 24);
    return slug + '-' + Date.now().toString(36);
  }

  function postFila(sheet, fields) {
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sheet: sheet, fields: fields })
    }).then(function(r) { return r.json(); });
  }

  function postJson(payload) {
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); });
  }

  document.getElementById('f').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    msg.textContent = '';
    msg.className = '';

    if (activeTab === 'nuevo') {
      btn.disabled = true;
      const idNuevo = generarIdProyecto(document.getElementById('nombre_direccion').value);
      const proyecto = {
        id_proyecto: idNuevo,
        nombre_direccion: document.getElementById('nombre_direccion').value,
        pais: document.getElementById('pais').value,
        fecha_compra: document.getElementById('fecha_compra').value,
        estado: document.getElementById('estado').value,
        fecha_venta_estimada: document.getElementById('fecha_venta_estimada').value,
        precio_venta_estimado: document.getElementById('precio_venta_estimado').value
      };
      const presupuesto = [
        { id_proyecto: idNuevo, rubro: 'compra', sub_rubro: '', monto_presupuestado: document.getElementById('presupuesto_compra').value || 0 },
        { id_proyecto: idNuevo, rubro: 'remodelacion', sub_rubro: '', monto_presupuestado: document.getElementById('presupuesto_remodelacion').value || 0 },
        { id_proyecto: idNuevo, rubro: 'cierre_venta', sub_rubro: '', monto_presupuestado: document.getElementById('presupuesto_cierre').value || 0 }
      ];
      postJson({ modo: 'nuevo_proyecto', proyecto: proyecto, presupuesto: presupuesto }).then(function(data) {
        btn.disabled = false;
        if (data.ok) { msg.textContent = 'Proyecto creado.'; msg.className = 'ok'; document.getElementById('f').reset(); }
        else { msg.textContent = 'Error: ' + data.error; msg.className = 'err'; }
      }).catch(function() { btn.disabled = false; msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });

    } else if (activeTab === 'financiamiento') {
      const tipo = document.getElementById('tipo_fuente').value;
      const destino = document.getElementById('destino').value;
      const idProyecto = document.getElementById('proyecto_fin').value;

      function registrarGastoSiCompra(montoTotal, fecha) {
        if (destino !== 'compra' || !montoTotal) return Promise.resolve({ ok: true });
        return postFila('Ejecucion', {
          id_proyecto: idProyecto,
          fecha: fecha,
          rubro: 'compra',
          sub_rubro: '',
          monto: montoTotal,
          proveedor_gc: '',
          comprobante_nota: 'Generado automáticamente desde financiamiento de compra'
        });
      }

      if (tipo === 'propio') {
        const total = socios.reduce(function(acc, s) { return acc + (parseFloat(s.pct) || 0); }, 0);
        if (Math.abs(total - 100) > 0.5) {
          msg.textContent = 'El reparto entre socios tiene que sumar 100%.';
          msg.className = 'err';
          return;
        }
        const montoTotal = parseFloat(document.getElementById('monto_propio_total').value) || 0;
        const fecha = document.getElementById('fecha_desembolso_propio').value;
        btn.disabled = true;

        const envios = socios.map(function(s) {
          return postFila('Financiamiento', {
            id_proyecto: idProyecto,
            tipo_fuente: 'propio',
            nombre_prestamista_inversor: s.nombre,
            monto: (montoTotal * (parseFloat(s.pct) || 0) / 100).toFixed(2),
            tasa_anual: '',
            fecha_desembolso: fecha,
            penalidad_prepago: '',
            retorno_pactado: '',
            destino: destino
          });
        });

        Promise.all(envios).then(function(resultados) {
          const fallo = resultados.find(function(r) { return !r.ok; });
          if (fallo) { btn.disabled = false; msg.textContent = 'Error: ' + fallo.error; msg.className = 'err'; return; }
          return registrarGastoSiCompra(montoTotal, fecha).then(function() {
            btn.disabled = false;
            msg.textContent = 'Guardado (' + socios.length + ' socios).';
            msg.className = 'ok';
            document.getElementById('monto_propio_total').value = '';
          });
        }).catch(function() { btn.disabled = false; msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });

      } else {
        btn.disabled = true;
        const monto = document.getElementById('monto_fin').value;
        const fecha = document.getElementById('fecha_desembolso').value;
        const fields = {
          id_proyecto: idProyecto,
          tipo_fuente: tipo,
          nombre_prestamista_inversor: document.getElementById('nombre_prestamista_inversor').value,
          monto: monto,
          tasa_anual: document.getElementById('tasa_anual').value,
          fecha_desembolso: fecha,
          penalidad_prepago: document.getElementById('penalidad_prepago').value,
          retorno_pactado: document.getElementById('retorno_pactado').value,
          destino: destino
        };
        postFila('Financiamiento', fields).then(function(data) {
          if (!data.ok) { btn.disabled = false; msg.textContent = 'Error: ' + data.error; msg.className = 'err'; return; }
          return registrarGastoSiCompra(parseFloat(monto) || 0, fecha).then(function() {
            btn.disabled = false;
            msg.textContent = 'Guardado.';
            msg.className = 'ok';
            document.getElementById('f').reset();
          });
        }).catch(function() { btn.disabled = false; msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });
      }

    } else {
      btn.disabled = true;
      const fields = {
        id_proyecto: document.getElementById('proyecto_cierre').value,
        fecha_venta: document.getElementById('fecha_venta').value,
        precio_venta: document.getElementById('precio_venta').value,
        gastos_cierre_venta: document.getElementById('gastos_cierre_venta').value,
        fecha_cancelacion_prestamo: document.getElementById('fecha_cancelacion_prestamo').value
      };
      postFila('Cierre_venta', fields).then(function(data) {
        btn.disabled = false;
        if (data.ok) { msg.textContent = 'Guardado.'; msg.className = 'ok'; document.getElementById('f').reset(); }
        else { msg.textContent = 'Error: ' + data.error; msg.className = 'err'; }
      }).catch(function() { btn.disabled = false; msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });
    }
  });
</script>
</body>
</html>
