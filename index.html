<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipping — panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1>Flipping — panel</h1>
    <p class="sub">Proyectos activos y situación general</p>
  </div>
</div>

<div class="wrap">
  <div class="kpi-grid">
    <div class="kpi pastel-green" id="kpi-ganancia-card"><p class="label">Ganancia del año</p><p class="value" id="kpi-ganancia">—</p></div>
    <div class="kpi pastel-blue" id="kpi-activos-card" style="cursor:pointer"><p class="label">Activos</p><p class="value" id="kpi-activos">—</p></div>
    <div class="kpi pastel-amber" id="kpi-pasivos-card" style="cursor:pointer"><p class="label">Pasivos</p><p class="value" id="kpi-pasivos">—</p></div>
  </div>

  <div class="card">
    <h2>Proyectos activos</h2>
    <div id="lista-proyectos"><p class="sub" style="margin:0">Cargando…</p></div>
  </div>

  <div class="card" id="card-cuentas">
    <h2>Cuenta corriente por actor</h2>
    <div id="cuadro-cuentas"><p class="sub" style="margin:0">Cargando…</p></div>
  </div>

  <div class="card" id="card-financiero">
    <h2>Financiamiento activo por proyecto</h2>
    <div id="cuadro-financiero"><p class="sub" style="margin:0">Cargando…</p></div>
  </div>

  <div class="card" id="card-vendidos" style="display:none">
    <h2>Proyectos vendidos</h2>
    <div id="lista-vendidos"></div>
  </div>

  <div class="actions">
    <a class="btn" href="proyecto.html">+ Nuevo proyecto</a>
    <button type="button" class="btn secondary" id="btn-mostrar-movimiento">+ Aporte / retiro de cuenta</button>
  </div>

  <div class="card" id="card-movimiento" style="display:none;margin-top:16px">
    <p class="sub" style="margin:0 0 8px;text-transform:uppercase;letter-spacing:0.04em;font-weight:600">Registrar movimiento de cuenta</p>
    <label for="mov-actor">Actor</label>
    <input type="text" id="mov-actor" placeholder="Nombre del socio, inversor o banco">
    <label for="mov-tipo">Tipo de movimiento</label>
    <select id="mov-tipo">
      <option value="aporte_externo">Aporte externo (entra plata)</option>
      <option value="retiro">Retiro (sale plata del sistema)</option>
    </select>
    <label for="mov-monto">Monto</label>
    <input type="number" id="mov-monto" step="0.01" min="0">
    <label for="mov-fecha">Fecha</label>
    <input type="date" id="mov-fecha">
    <label for="mov-nota">Nota</label>
    <input type="text" id="mov-nota">
    <button type="button" id="btn-guardar-movimiento" style="width:100%;margin-top:20px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600">Guardar</button>
    <div id="msg-movimiento"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-detalle">
  <div class="modal" style="max-width:420px">
    <h3 id="modal-detalle-titulo">Detalle</h3>
    <div id="modal-detalle-lista" style="margin:14px 0"></div>
    <button type="button" class="btn secondary" id="btn-cerrar-modal" style="width:100%;justify-content:center">Cerrar</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtByIeeZt4ohelM1HOtzqVGj4dal4sgVri4-2vVRS3F1yWiEX81wh8y8cBrNBirc8x/exec';

  function fmt(n) {
    return '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
  }

  let ultimoDashboard = null;

  fetch(APPS_SCRIPT_URL + '?accion=dashboard')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) {
        document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:0">Error: ' + res.error + '</p>';
        return;
      }
      const d = res.data;
      ultimoDashboard = d;

      const kg = document.getElementById('kpi-ganancia');
      kg.textContent = fmt(d.ganancia_anio);
      document.getElementById('kpi-ganancia-card').className = 'kpi ' + (d.ganancia_anio >= 0 ? 'pastel-green' : 'pastel-red');

      document.getElementById('kpi-activos').textContent = fmt(d.activos);
      document.getElementById('kpi-pasivos').textContent = fmt(d.pasivos);

      const cont = document.getElementById('lista-proyectos');
      if (!d.proyectos_activos.length) {
        cont.innerHTML = '<p class="sub" style="margin:0">No hay proyectos activos todavía.</p>';
        return;
      }
      cont.innerHTML = '';
      d.proyectos_activos.forEach(function(p) {
        const a = document.createElement('a');
        a.className = 'proyecto-card';
        a.href = 'proyecto-editar.html?id=' + encodeURIComponent(p.id);
        a.innerHTML =
          '<div class="fila">' +
            '<div><div class="nombre">' + (p.nombre || p.id) + '</div>' +
            '<div class="meta">' + (p.pais || '') + ' · ' + (p.estado || '').replace('_',' ') + '</div></div>' +
            '<div class="fila"><div class="monto">' + fmt(p.valor_estimado) + '</div><span class="arrow">›</span></div>' +
          '</div>';
        cont.appendChild(a);
      });

      const finCont = document.getElementById('cuadro-financiero');
      const detalle = d.financiamiento_detalle || [];
      if (!detalle.length) {
        finCont.innerHTML = '<p class="sub" style="margin:0">Sin financiamiento activo todavía.</p>';
      } else {
        finCont.innerHTML = detalle.map(function(f) {
          return '<div class="hist-row"><span>' + f.proyecto + ' · ' + f.tipo_fuente + (f.nombre ? ' (' + f.nombre + ')' : '') + '</span><span>' + fmt(f.monto) + '</span></div>';
        }).join('');
      }

      const cuentasCont = document.getElementById('cuadro-cuentas');
      const actores = d.actores_resumen || [];
      if (!actores.length) {
        cuentasCont.innerHTML = '<p class="sub" style="margin:0">Sin movimientos todavía.</p>';
      } else {
        cuentasCont.innerHTML = actores.map(function(a) {
          return '<div class="hist-row"><span>' + a.actor + '</span><span style="color:' + (a.saldo < 0 ? 'var(--danger)' : 'var(--text-secondary)') + '">' + fmt(a.saldo) + '</span></div>';
        }).join('');
      }

      const vendidos = d.proyectos_vendidos || [];
      if (vendidos.length) {
        document.getElementById('card-vendidos').style.display = 'block';
        const contV = document.getElementById('lista-vendidos');
        contV.innerHTML = '';
        vendidos.forEach(function(p) {
          const a = document.createElement('a');
          a.className = 'proyecto-card';
          a.href = 'proyecto-editar.html?id=' + encodeURIComponent(p.id);
          a.innerHTML =
            '<div class="fila">' +
              '<div><div class="nombre">' + (p.nombre || p.id) + '</div>' +
              '<div class="meta">' + (p.pais || '') + ' · vendido' + (p.fecha_venta ? ' ' + String(p.fecha_venta).split('T')[0] : '') + '</div></div>' +
              '<div class="fila"><div class="monto" style="color:' + (p.ganancia >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + fmt(p.ganancia) + '</div><span class="arrow">›</span></div>' +
            '</div>';
          contV.appendChild(a);
        });
      }
    })
    .catch(function() {
      document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:0">No se pudo conectar.</p>';
    });

  function abrirModalDetalle(titulo, filas) {
    document.getElementById('modal-detalle-titulo').textContent = titulo;
    const cont = document.getElementById('modal-detalle-lista');
    if (!filas.length) {
      cont.innerHTML = '<p class="sub" style="margin:0">Sin datos todavía.</p>';
    } else {
      cont.innerHTML = filas.map(function(f) {
        return '<div class="hist-row"><span>' + f.label + '</span><span>' + fmt(f.monto) + '</span></div>';
      }).join('');
    }
    document.getElementById('modal-detalle').classList.add('show');
  }

  document.getElementById('kpi-activos-card').addEventListener('click', function() {
    if (!ultimoDashboard) return;
    const filas = ultimoDashboard.proyectos_activos
      .filter(function(p) { return p.valor_estimado > 0; })
      .map(function(p) { return { label: p.nombre || p.id, monto: p.valor_estimado }; });
    abrirModalDetalle('Activos por proyecto (valor de venta estimado)', filas);
  });

  document.getElementById('kpi-pasivos-card').addEventListener('click', function() {
    if (!ultimoDashboard) return;
    const filas = (ultimoDashboard.pasivos_detalle || [])
      .map(function(f) { return { label: f.proyecto + (f.nombre ? ' · ' + f.nombre : ''), monto: f.monto }; });
    abrirModalDetalle('Pasivos por fuente', filas);
  });

  document.getElementById('btn-cerrar-modal').addEventListener('click', function() {
    document.getElementById('modal-detalle').classList.remove('show');
  });

  document.getElementById('btn-mostrar-movimiento').addEventListener('click', function() {
    const card = document.getElementById('card-movimiento');
    card.style.display = card.style.display === 'none' ? 'block' : 'none';
    if (!document.getElementById('mov-fecha').value) {
      document.getElementById('mov-fecha').valueAsDate = new Date();
    }
  });

  document.getElementById('btn-guardar-movimiento').addEventListener('click', function() {
    const msg = document.getElementById('msg-movimiento');
    const actor = document.getElementById('mov-actor').value.trim();
    const monto = parseFloat(document.getElementById('mov-monto').value) || 0;
    if (!actor || !monto) {
      msg.textContent = 'Completá el actor y el monto.';
      msg.className = 'err';
      return;
    }
    const fields = {
      mov_id: 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      actor: actor,
      tipo_actor: 'propio',
      id_proyecto: '',
      tipo_movimiento: document.getElementById('mov-tipo').value,
      monto: monto,
      fecha: document.getElementById('mov-fecha').value,
      nota: document.getElementById('mov-nota').value
    };
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sheet: 'Movimientos', fields: fields })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) { window.location.reload(); }
        else { msg.textContent = 'Error: ' + data.error; msg.className = 'err'; }
      })
      .catch(function() { msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });
  });
</script>
</body>
</html>
