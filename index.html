<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipping — panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Flipping — panel</h1>
  <p class="sub">Proyectos activos y situación general</p>

  <div class="kpi-grid">
    <div class="kpi"><p class="label">Ganancia del año</p><p class="value" id="kpi-ganancia">—</p></div>
    <div class="kpi"><p class="label">Activos</p><p class="value" id="kpi-activos">—</p></div>
    <div class="kpi"><p class="label">Pasivos</p><p class="value" id="kpi-pasivos">—</p></div>
  </div>

  <div class="card">
    <p class="sub" style="margin-bottom:6px">Proyectos activos</p>
    <div id="lista-proyectos"><p class="sub" style="margin:8px 0 0">Cargando…</p></div>
  </div>

  <div class="actions">
    <a class="btn" href="proyecto.html">Cargar proyecto</a>
    <a class="btn secondary" href="ejecucion.html">Cargar gasto</a>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtByIeeZt4ohelM1HOtzqVGj4dal4sgVri4-2vVRS3F1yWiEX81wh8y8cBrNBirc8x/exec';

  function fmt(n) {
    return '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
  }

  fetch(APPS_SCRIPT_URL + '?accion=dashboard')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) {
        document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:8px 0 0">Error: ' + res.error + '</p>';
        return;
      }
      const d = res.data;

      const kg = document.getElementById('kpi-ganancia');
      kg.textContent = fmt(d.ganancia_anio);
      kg.className = 'value ' + (d.ganancia_anio >= 0 ? 'pos' : 'neg');

      document.getElementById('kpi-activos').textContent = fmt(d.activos);
      document.getElementById('kpi-pasivos').textContent = fmt(d.pasivos);

      const cont = document.getElementById('lista-proyectos');
      if (!d.proyectos_activos.length) {
        cont.innerHTML = '<p class="sub" style="margin:8px 0 0">No hay proyectos activos todavía.</p>';
        return;
      }
      cont.innerHTML = '';
      d.proyectos_activos.forEach(function(p) {
        const row = document.createElement('div');
        row.className = 'proyecto-row';
        row.innerHTML =
          '<div><div class="nombre">' + (p.nombre || p.id) + '</div>' +
          '<div class="meta">' + (p.pais || '') + ' · ' + (p.estado || '') + '</div></div>' +
          '<div class="monto">' + fmt(p.ejecutado) + '</div>';
        cont.appendChild(row);
      });
    })
    .catch(function() {
      document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:8px 0 0">No se pudo conectar.</p>';
    });
</script>
</body>
</html>
