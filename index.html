<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipping — panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <h1>Flipping — panel</h1>
    <p class="sub">Proyectos activos y situación general</p>
  </div>
</div>

<div class="wrap">
  <div class="kpi-grid">
    <div class="kpi pastel-green" id="kpi-ganancia-card"><p class="label">Ganancia del año</p><p class="value" id="kpi-ganancia">—</p></div>
    <div class="kpi pastel-blue" id="kpi-activos-card" style="cursor:pointer"><p class="label">Activos</p><p class="value" id="kpi-activos">—</p></div>
    <div class="kpi pastel-amber" id="kpi-financiacion-card" style="cursor:pointer"><p class="label">Financiación</p><p class="value" id="kpi-financiacion">—</p></div>
  </div>

  <div class="card">
    <h2>Proyectos activos</h2>
    <div id="lista-proyectos"><p class="sub" style="margin:0">Cargando…</p></div>
  </div>

  <div class="card" id="card-vendidos" style="display:none">
    <h2>Proyectos vendidos</h2>
    <div id="lista-vendidos"></div>
  </div>

  <div class="actions">
    <a class="btn" href="proyecto.html">+ Nuevo proyecto</a>
  </div>
</div>

<div class="modal-overlay" id="modal-detalle">
  <div class="modal" style="max-width:420px">
    <p class="sub" id="modal-detalle-atras" style="display:none;cursor:pointer;margin:0 0 8px">← Atrás</p>
    <h3 id="modal-detalle-titulo">Detalle</h3>
    <div id="modal-detalle-lista" style="margin:14px 0"></div>
    <div id="modal-detalle-form" style="display:none"></div>
    <button type="button" class="btn secondary" id="btn-cerrar-modal" style="width:100%;justify-content:center">Cerrar</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtByIeeZt4ohelM1HOtzqVGj4dal4sgVri4-2vVRS3F1yWiEX81wh8y8cBrNBirc8x/exec';

  function fmt(n) {
    return '$' + Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
  }

  const ETIQUETAS_CATEGORIA = { propio: 'Capital propio', inversor: 'Inversores', prestamo: 'Préstamos' };

  let ultimoDashboard = null;

  fetch(APPS_SCRIPT_URL + '?accion=dashboard')
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) {
        document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:0">Error: ' + res.error + '</p>';
        return;
      }
      const d = res.data;
      ultimoDashboard = d;

      const kg = document.getElementById('kpi-ganancia');
      kg.textContent = fmt(d.ganancia_anio);
      document.getElementById('kpi-ganancia-card').className = 'kpi ' + (d.ganancia_anio >= 0 ? 'pastel-green' : 'pastel-red');

      document.getElementById('kpi-activos').textContent = fmt(d.activos);

      const r = d.financiamiento_resumen || { propio: 0, prestamo: 0, inversor: 0 };
      const totalFinanciacion = (r.propio || 0) + (r.prestamo || 0) + (r.inversor || 0);
      document.getElementById('kpi-financiacion').textContent = fmt(totalFinanciacion);

      const cont = document.getElementById('lista-proyectos');
      if (!d.proyectos_activos.length) {
        cont.innerHTML = '<p class="sub" style="margin:0">No hay proyectos activos todavía.</p>';
      } else {
        cont.innerHTML = '';
        d.proyectos_activos.forEach(function(p) {
          const a = document.createElement('a');
          a.className = 'proyecto-card';
          a.href = 'proyecto-editar.html?id=' + encodeURIComponent(p.id);
          a.innerHTML =
            '<div class="fila">' +
              '<div><div class="nombre">' + (p.nombre || p.id) + '</div>' +
              '<div class="meta">' + (p.pais || '') + ' · ' + (p.estado || '').replace('_',' ') + '</div></div>' +
              '<div class="fila"><div class="monto">' + fmt(p.valor_estimado) + '</div><span class="arrow">›</span></div>' +
            '</div>';
          cont.appendChild(a);
        });
      }

      const vendidos = d.proyectos_vendidos || [];
      if (vendidos.length) {
        document.getElementById('card-vendidos').style.display = 'block';
        const contV = document.getElementById('lista-vendidos');
        contV.innerHTML = '';
        vendidos.forEach(function(p) {
          const a = document.createElement('a');
          a.className = 'proyecto-card';
          a.href = 'proyecto-editar.html?id=' + encodeURIComponent(p.id);
          a.innerHTML =
            '<div class="fila">' +
              '<div><div class="nombre">' + (p.nombre || p.id) + '</div>' +
              '<div class="meta">' + (p.pais || '') + ' · vendido' + (p.fecha_venta ? ' ' + String(p.fecha_venta).split('T')[0] : '') + '</div></div>' +
              '<div class="fila"><div class="monto" style="color:' + (p.ganancia >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + fmt(p.ganancia) + '</div><span class="arrow">›</span></div>' +
            '</div>';
          contV.appendChild(a);
        });
      }
    })
    .catch(function() {
      document.getElementById('lista-proyectos').innerHTML = '<p class="sub" style="margin:0">No se pudo conectar.</p>';
    });

  // --- Modal de Financiación con 3 niveles: categoría → actor → aporte/retiro ---

  function abrirModal(titulo, filasHtml, mostrarAtras, onAtras) {
    document.getElementById('modal-detalle-titulo').textContent = titulo;
    document.getElementById('modal-detalle-lista').innerHTML = filasHtml;
    document.getElementById('modal-detalle-form').style.display = 'none';
    const atras = document.getElementById('modal-detalle-atras');
    atras.style.display = mostrarAtras ? 'block' : 'none';
    atras.onclick = onAtras || null;
    document.getElementById('modal-detalle').classList.add('show');
  }

  function mostrarNivelCategorias() {
    if (!ultimoDashboard) return;
    const r = ultimoDashboard.financiamiento_resumen || { propio: 0, prestamo: 0, inversor: 0 };
    const pendientes = ultimoDashboard.recuperos_pendientes || [];
    let aviso = '';
    if (pendientes.length) {
      const porProyecto = {};
      pendientes.forEach(function(p) { porProyecto[p.proyecto] = (porProyecto[p.proyecto] || 0) + p.monto; });
      const detalle = Object.keys(porProyecto).map(function(nombre) { return nombre + ' (' + fmt(porProyecto[nombre]) + ')'; }).join(', ');
      aviso = '<div class="hist-row" style="background:var(--danger-soft);border-radius:8px;padding:10px 12px;margin-bottom:10px;border-bottom:none">' +
        '<span style="color:var(--danger);font-size:13px">⚠️ Recupero pendiente: ' + detalle + '</span></div>';
    }
    const filas = aviso + ['propio', 'inversor', 'prestamo'].map(function(cat) {
      return '<div class="hist-row categoria-fin" data-cat="' + cat + '" style="cursor:pointer"><span>' + ETIQUETAS_CATEGORIA[cat] + '</span><span>' + fmt(r[cat]) + '</span></div>';
    }).join('');
    abrirModal('Financiación', filas, false, null);
    document.querySelectorAll('.categoria-fin').forEach(function(el) {
      el.addEventListener('click', function() { mostrarNivelActores(el.dataset.cat); });
    });
  }

  function mostrarNivelActores(categoria) {
    if (!ultimoDashboard) return;
    const detalle = (ultimoDashboard.financiamiento_detalle || []).filter(function(f) { return f.tipo_fuente === categoria; });
    const porActor = {};
    detalle.forEach(function(f) { porActor[f.nombre] = (porActor[f.nombre] || 0) + f.monto; });
    const nombres = Object.keys(porActor);
    const filas = (nombres.length
      ? nombres.map(function(nombre) {
          return '<div class="hist-row actor-fin" data-actor="' + nombre.replace(/"/g, '&quot;') + '" data-cat="' + categoria + '" style="cursor:pointer"><span>' + nombre + '</span><span>' + fmt(porActor[nombre]) + '</span></div>';
        }).join('')
      : '<p class="sub" style="margin:0 0 10px">Sin financiamiento activo en esta categoría.</p>') +
      '<div class="hist-row" id="btn-sumar-actor" style="cursor:pointer;border-bottom:none"><span style="color:var(--accent);font-weight:600">+ Sumar ' + ETIQUETAS_CATEGORIA[categoria].toLowerCase() + '</span></div>';
    abrirModal(ETIQUETAS_CATEGORIA[categoria], filas, true, mostrarNivelCategorias);
    document.querySelectorAll('.actor-fin').forEach(function(el) {
      el.addEventListener('click', function() { mostrarNivelActor(el.dataset.actor, el.dataset.cat); });
    });
    document.getElementById('btn-sumar-actor').addEventListener('click', function() { mostrarFormNuevoActor(categoria); });
  }

  function mostrarFormNuevoActor(categoria) {
    abrirModal('Sumar ' + ETIQUETAS_CATEGORIA[categoria].toLowerCase(), '', true, function() { mostrarNivelActores(categoria); });
    const form = document.getElementById('modal-detalle-form');
    form.style.display = 'block';
    form.innerHTML =
      '<label for="nuevo-actor-nombre">Nombre</label>' +
      '<input type="text" id="nuevo-actor-nombre" placeholder="Nombre del socio, inversor o banco">' +
      '<label for="nuevo-actor-monto">Monto que entra al sistema</label>' +
      '<input type="number" id="nuevo-actor-monto" step="0.01" min="0">' +
      '<label for="nuevo-actor-fecha">Fecha</label>' +
      '<input type="date" id="nuevo-actor-fecha">' +
      '<label for="nuevo-actor-nota">Nota</label>' +
      '<input type="text" id="nuevo-actor-nota">' +
      '<button type="button" id="btn-guardar-nuevo-actor" style="width:100%;margin-top:16px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;cursor:pointer;font-weight:600">Guardar</button>' +
      '<div id="msg-nuevo-actor" style="margin-top:8px;font-size:13px"></div>';
    document.getElementById('nuevo-actor-fecha').valueAsDate = new Date();

    document.getElementById('btn-guardar-nuevo-actor').addEventListener('click', function() {
      const msg = document.getElementById('msg-nuevo-actor');
      const nombre = document.getElementById('nuevo-actor-nombre').value.trim();
      const monto = parseFloat(document.getElementById('nuevo-actor-monto').value) || 0;
      if (!nombre || !monto) { msg.textContent = 'Completá el nombre y el monto.'; msg.className = 'err'; return; }
      const fields = {
        mov_id: 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        actor: nombre,
        tipo_actor: categoria,
        id_proyecto: '',
        tipo_movimiento: 'aporte_externo',
        monto: monto,
        fecha: document.getElementById('nuevo-actor-fecha').value,
        nota: document.getElementById('nuevo-actor-nota').value
      };
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ sheet: 'Movimientos', fields: fields })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) { window.location.reload(); }
          else { msg.textContent = 'Error: ' + data.error; msg.className = 'err'; }
        })
        .catch(function() { msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });
    });
  }

  function mostrarNivelActor(actor, categoria) {
    const info = (ultimoDashboard.actores_resumen || []).find(function(a) { return a.actor === actor; });
    const saldo = info ? info.saldo : 0;

    const filasIniciales = '<div class="hist-row"><span>Cuenta corriente</span><span style="color:' + (saldo < 0 ? 'var(--danger)' : 'var(--text-secondary)') + '">' + fmt(saldo) + '</span></div>' +
      '<p class="sub" style="margin:10px 0 0">Cargando movimientos…</p>';
    abrirModal(actor, filasIniciales, true, function() { mostrarNivelActores(categoria); });
    mostrarFormActor(actor, categoria);

    const nombrePorId = {};
    (ultimoDashboard.proyectos_activos || []).forEach(function(p) { nombrePorId[p.id] = p.nombre; });
    (ultimoDashboard.proyectos_vendidos || []).forEach(function(p) { nombrePorId[p.id] = p.nombre; });

    fetch(APPS_SCRIPT_URL + '?accion=movimientos_actor&actor=' + encodeURIComponent(actor))
      .then(function(r) { return r.json(); })
      .then(function(res) {
        const movs = res.ok ? res.movimientos : [];
        let aporteExterno = 0, retiro = 0;
        const porProyecto = {};
        movs.forEach(function(m) {
          const monto = parseFloat(m.monto) || 0;
          if (!m.id_proyecto) {
            if (m.tipo_movimiento === 'aporte_externo') aporteExterno += monto;
            else if (m.tipo_movimiento === 'retiro') retiro += monto;
          } else {
            if (!porProyecto[m.id_proyecto]) porProyecto[m.id_proyecto] = { aportado: 0, recuperado: 0 };
            if (m.tipo_movimiento === 'aporte_proyecto') porProyecto[m.id_proyecto].aportado += monto;
            else if (m.tipo_movimiento === 'devolucion_proyecto') porProyecto[m.id_proyecto].recuperado += monto;
          }
        });

        let filas = '<div class="hist-row"><span>Cuenta corriente</span><span style="color:' + (saldo < 0 ? 'var(--danger)' : 'var(--text-secondary)') + '">' + fmt(saldo) + '</span></div>';
        if (aporteExterno) filas += '<div class="hist-row" style="font-size:13px"><span>Aportes externos</span><span style="color:var(--success)">+' + fmt(aporteExterno) + '</span></div>';
        if (retiro) filas += '<div class="hist-row" style="font-size:13px"><span>Retiros</span><span style="color:var(--danger)">−' + fmt(retiro) + '</span></div>';

        const ids = Object.keys(porProyecto);
        if (ids.length) {
          filas += '<p class="sub" style="margin:10px 0 4px">Por proyecto</p>';
          filas += '<div class="hist-row" style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em"><span>Proyecto</span><span style="display:flex;gap:14px"><span style="width:66px;text-align:right">Aportado</span><span style="width:66px;text-align:right">Recuperado</span></span></div>';
          filas += ids.map(function(id) {
            const d = porProyecto[id];
            const nombre = nombrePorId[id] || id;
            return '<div class="hist-row" style="font-size:13px"><span>' + nombre + '</span><span style="display:flex;gap:14px"><span style="width:66px;text-align:right">' + fmt(d.aportado) + '</span><span style="width:66px;text-align:right;color:var(--success)">' + fmt(d.recuperado) + '</span></span></div>';
          }).join('');
        }
        if (!aporteExterno && !retiro && !ids.length) {
          filas += '<p class="sub" style="margin:10px 0 0">Sin movimientos todavía.</p>';
        }
        document.getElementById('modal-detalle-lista').innerHTML = filas;
      })
      .catch(function() {
        document.getElementById('modal-detalle-lista').innerHTML += '<p class="sub" style="margin:10px 0 0">No se pudo cargar el historial.</p>';
      });
  }

  function mostrarFormActor(actor, categoria) {
    const info = (ultimoDashboard.actores_resumen || []).find(function(a) { return a.actor === actor; });
    const saldo = info ? info.saldo : 0;
    const form = document.getElementById('modal-detalle-form');
    form.style.display = 'block';
    let formHtml =
      '<button type="button" id="btn-mostrar-form-movimiento" class="btn secondary" style="width:100%;margin-top:16px;justify-content:center">Registrar aporte o retiro</button>' +
      '<div id="campos-movimiento" style="display:none">' +
        '<label for="mov-tipo" style="margin-top:16px">Tipo</label>' +
        '<select id="mov-tipo">' +
          '<option value="aporte_externo">Aporte externo (entra plata)</option>' +
          '<option value="retiro">Retiro (sale plata del sistema)</option>' +
        '</select>' +
        '<label for="mov-monto">Monto</label>' +
        '<input type="number" id="mov-monto" step="0.01" min="0">' +
        '<label for="mov-fecha">Fecha</label>' +
        '<input type="date" id="mov-fecha">' +
        '<label for="mov-nota">Nota</label>' +
        '<input type="text" id="mov-nota">' +
        '<button type="button" id="btn-guardar-movimiento" style="width:100%;margin-top:16px;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;cursor:pointer;font-weight:600">Guardar</button>' +
        '<div id="msg-movimiento" style="margin-top:8px;font-size:13px"></div>' +
      '</div>';
    if (Math.abs(saldo) < 0.01) {
      formHtml += '<button type="button" id="btn-eliminar-actor" class="btn danger" style="width:100%;margin-top:20px;justify-content:center">− Eliminar ' + actor + '</button>';
    }
    form.innerHTML = formHtml;
    document.getElementById('mov-fecha').valueAsDate = new Date();

    document.getElementById('btn-mostrar-form-movimiento').addEventListener('click', function() {
      document.getElementById('campos-movimiento').style.display = 'block';
      this.style.display = 'none';
    });

    document.getElementById('btn-guardar-movimiento').addEventListener('click', function() {
      const msg = document.getElementById('msg-movimiento');
      const monto = parseFloat(document.getElementById('mov-monto').value) || 0;
      if (!monto) { msg.textContent = 'Completá el monto.'; msg.className = 'err'; return; }
      const fields = {
        mov_id: 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        actor: actor,
        tipo_actor: categoria,
        id_proyecto: '',
        tipo_movimiento: document.getElementById('mov-tipo').value,
        monto: monto,
        fecha: document.getElementById('mov-fecha').value,
        nota: document.getElementById('mov-nota').value
      };
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ sheet: 'Movimientos', fields: fields })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) { window.location.reload(); }
          else { msg.textContent = 'Error: ' + data.error; msg.className = 'err'; }
        })
        .catch(function() { msg.textContent = 'No se pudo conectar.'; msg.className = 'err'; });
    });

    const btnEliminar = document.getElementById('btn-eliminar-actor');
    if (btnEliminar) {
      btnEliminar.addEventListener('click', function() {
        if (!confirm('¿Eliminar a ' + actor + '? Se van a borrar todos sus movimientos. No se puede deshacer.')) return;
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ modo: 'eliminar_actor', actor: actor })
        })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.ok) { window.location.reload(); }
            else { alert('Error: ' + data.error); }
          })
          .catch(function() { alert('No se pudo conectar.'); });
      });
    }
  }

  document.getElementById('kpi-financiacion-card').addEventListener('click', mostrarNivelCategorias);

  document.getElementById('kpi-activos-card').addEventListener('click', function() {
    if (!ultimoDashboard) return;
    const filas = ultimoDashboard.proyectos_activos
      .filter(function(p) { return p.valor_estimado > 0; })
      .map(function(p) { return '<div class="hist-row"><span>' + (p.nombre || p.id) + '</span><span>' + fmt(p.valor_estimado) + '</span></div>'; })
      .join('') || '<p class="sub" style="margin:0">Sin datos todavía.</p>';
    abrirModal('Activos por proyecto (valor de venta estimado)', filas, false, null);
  });

  document.getElementById('btn-cerrar-modal').addEventListener('click', function() {
    document.getElementById('modal-detalle').classList.remove('show');
  });
  document.getElementById('modal-detalle').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
</script>
</body>
</html>
